<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>遊戲大廳 - 兒童創意樂園</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 950px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 6px solid #fff;
        }
        /* 頂部標題 */
        .header {
            background: #ff7043;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sound-btn {
            background: #ffca28;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 2px 0 #ffa000;
        }

        /* 遊戲大廳主要區域 */
        .lobby {
            flex: 1;
            padding: 20px 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            background: #f9fbe7;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #ffd54f, #ffb300);
            border-radius: 20px;
            padding: 18px 20px;
            text-align: center;
            color: #5d4037;
            box-shadow: 0 6px 0 #ff8f00;
            border: 3px solid #fff;
        }
        .welcome-banner h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }
        .welcome-banner p {
            margin: 0;
            font-size: 14px;
            color: #6d4c41;
        }

        /* 遊戲卡片 */
        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .game-card {
            background: #fff;
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.08);
            border: 3px solid #ffe082;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .game-card:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
        }
        .game-icon {
            font-size: 44px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff3e0;
            border-radius: 18px;
            flex-shrink: 0;
            border: 2px dashed #ffb74d;
        }
        .game-info {
            flex: 1;
            text-align: left;
        }
        .game-info h3 {
            margin: 0 0 4px;
            font-size: 19px;
            color: #333;
        }
        .game-info p {
            margin: 0;
            font-size: 13px;
            color: #888;
            line-height: 1.4;
        }
        .play-badge {
            background: #4caf50;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 3px 0 #388e3c;
            flex-shrink: 0;
        }

        /* 通用隱藏 */
        .hidden { display: none !important; }

        /* ---------- 畫板遊戲介面 ---------- */
        .paint-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .paint-header {
            background: #ff7043;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .paint-header .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .paint-header .sound-btn {
            background: #ffca28;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 2px 0 #ffa000;
        }
        .back-btn {
            background: #ffca28;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 2px 0 #ffa000;
        }
        .canvas-area {
            flex: 1;
            background: #111122;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
        }
        .canvas-area canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .toolbar {
            background: #fff8e1;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 3px solid #ffe082;
        }
        .palette {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .color-btn.active {
            transform: scale(1.25);
            border-color: #333;
        }
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .action-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #388e3c;
            flex: 1;
        }
        .action-btn.clear {
            background: #e57373;
            box-shadow: 0 4px 0 #c62828;
        }
        .action-btn.save {
            background: #4285F4;
            box-shadow: 0 4px 0 #1967d2;
        }

        /* ---------- 翻牌遊戲介面 ---------- */
        .memory-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .memory-header {
            background: #7b1fa2;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .memory-header .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .memory-header .back-btn {
            background: #ce93d8;
            box-shadow: 0 2px 0 #8e24aa;
        }
        .memory-content {
            flex: 1;
            padding: 16px;
            background: linear-gradient(180deg, #f3e5f5, #e1bee7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            overflow-y: auto;
        }
        .memory-status {
            background: #fff;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #6a1b9a;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            text-align: center;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 360px;
        }
        .card {
            aspect-ratio: 1 / 1;
            perspective: 600px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 14px;
        }
        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }
        .card-front {
            background: linear-gradient(135deg, #ba68c8, #7b1fa2);
            color: #fff;
            font-size: 40px;
        }
        .card-back {
            background: #fff;
            transform: rotateY(180deg);
            border: 3px solid #ce93d8;
        }
        .card.matched .card-back {
            background: #c8e6c9;
            border-color: #81c784;
        }
        .memory-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }
        .memory-actions .action-btn {
            flex: 1;
            font-size: 15px;
            padding: 10px 0;
        }
        .memory-actions .action-btn.reset {
            background: #7b1fa2;
            box-shadow: 0 4px 0 #4a148c;
        }
        .memory-win {
            font-size: 18px;
            font-weight: bold;
            color: #6a1b9a;
            text-align: center;
            padding: 10px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            display: none;
        }
        .memory-win.show {
            display: block;
        }

        /* 開始遮罩（暱稱輸入） */
        .welcome-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .welcome-card {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .welcome-card h2 {
            margin-top: 0;
        }
        .welcome-card input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin: 15px 0;
            border: 2px solid #ccc;
            border-radius: 12px;
            text-align: center;
        }
        .start-btn {
            background: #ff7043;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #d84315;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- 大廳視圖 -->
        <div id="lobbyView" class="lobby-view" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="header">
                <div class="header-title">
                    <span>🎮</span> <span>遊戲大廳</span>
                </div>
                <button class="sound-btn" id="sound-toggle-btn-lobby" onclick="toggleSound()">🔊 音效: 開</button>
            </div>
            <div class="lobby">
                <div class="welcome-banner">
                    <h2>👋 歡迎，<span id="lobby-username">小寶貝</span>！</h2>
                    <p>請選擇想玩的遊戲，更多遊戲陸續新增中 ✨</p>
                </div>
                <div class="game-grid" id="gameGrid">
                    <!-- 魔法畫板 -->
                    <div class="game-card" onclick="launchGame('paint')">
                        <div class="game-icon">🎨</div>
                        <div class="game-info">
                            <h3>神奇魔法畫板</h3>
                            <p>用手指或滑鼠自由塗鴉，繽紛色彩好好玩！</p>
                        </div>
                        <div class="play-badge">開始玩</div>
                    </div>
                    <!-- 記憶翻牌 -->
                    <div class="game-card" onclick="launchGame('memory')">
                        <div class="game-icon">🃏</div>
                        <div class="game-info">
                            <h3>記憶翻牌</h3>
                            <p>翻開卡片找出配對，訓練你的好記憶！</p>
                        </div>
                        <div class="play-badge">開始玩</div>
                    </div>
                    <!-- 預留擴充 -->
                    <div class="game-card" style="opacity: 0.6; pointer-events: none; border-color: #ddd;">
                        <div class="game-icon">🔢</div>
                        <div class="game-info">
                            <h3>猜數字</h3>
                            <p>猜猜看我想的數字是多少？即將推出！</p>
                        </div>
                        <div class="play-badge" style="background: #bdbdbd; box-shadow: 0 3px 0 #9e9e9e;">敬請期待</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 畫板遊戲視圖 -->
        <div id="paintView" class="paint-app hidden">
            <div class="paint-header">
                <div class="header-title">
                    <span>🎨</span> <span id="user-display">神奇魔法畫板</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="back-btn" onclick="goBackToLobby()">⬅ 大廳</button>
                    <button class="sound-btn" id="sound-toggle-btn-paint" onclick="toggleSound()">🔊 音效: 開</button>
                </div>
            </div>
            <div class="canvas-area" id="canvas-area">
                <canvas id="paintCanvas"></canvas>
            </div>
            <div class="toolbar">
                <div class="palette">
                    <div class="color-btn active" style="background: #ff5252;" onclick="setColor('#ff5252', event)"></div>
                    <div class="color-btn" style="background: #ffeb3b;" onclick="setColor('#ffeb3b', event)"></div>
                    <div class="color-btn" style="background: #69f0ae;" onclick="setColor('#69f0ae', event)"></div>
                    <div class="color-btn" style="background: #40c4ff;" onclick="setColor('#40c4ff', event)"></div>
                    <div class="color-btn" style="background: #e040fb;" onclick="setColor('#e040fb', event)"></div>
                    <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', event)"></div>
                </div>
                <div class="tools-row">
                    <button class="action-btn clear" onclick="clearCanvas()">🗑️ 全部清除</button>
                    <button class="action-btn save" onclick="finishArt()">✨ 完成作品！</button>
                </div>
            </div>
        </div>

        <!-- 記憶翻牌遊戲視圖 -->
        <div id="memoryView" class="memory-app hidden">
            <div class="memory-header">
                <div class="header-title">
                    <span>🃏</span> <span id="memory-user-display">記憶翻牌</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="back-btn" onclick="goBackToLobby()">⬅ 大廳</button>
                    <button class="sound-btn" id="sound-toggle-btn-memory" onclick="toggleSound()">🔊 音效: 開</button>
                </div>
            </div>
            <div class="memory-content">
                <div class="memory-status" id="memoryStatus">找到 0 / 8 組配對</div>
                <div class="memory-grid" id="memoryGrid"></div>
                <div class="memory-win" id="memoryWin">🎉 全部配對成功！你太厲害了！</div>
                <div class="memory-actions">
                    <button class="action-btn reset" onclick="resetMemoryGame()">🔄 重新開始</button>
                </div>
            </div>
        </div>

        <!-- 進入畫面遮罩（暱稱輸入） -->
        <div id="welcome-overlay" class="welcome-overlay">
            <div class="welcome-card">
                <h2>✨ 遊戲樂園 ✨</h2>
                <p style="color: #666; font-size: 15px;">請輸入你的小名：</p>
                <input type="text" id="player-name" placeholder="請輸入名字..." value="小寶貝">
                <button class="start-btn" id="start-btn">進入遊戲大廳</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 全域狀態 ==========
        let currentPlayerName = '小寶貝';
        let soundEnabled = true;
        let audioCtx = null;

        // ========== 音效控制 ==========
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateSoundButtons() {
            const label = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
            const btnLobby = document.getElementById('sound-toggle-btn-lobby');
            const btnPaint = document.getElementById('sound-toggle-btn-paint');
            const btnMemory = document.getElementById('sound-toggle-btn-memory');
            if (btnLobby) btnLobby.innerText = label;
            if (btnPaint) btnPaint.innerText = label;
            if (btnMemory) btnMemory.innerText = label;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            updateSoundButtons();
            if (soundEnabled) initAudio();
        }

        function playPopSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(300 + Math.random() * 400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } catch (e) {}
        }

        // 翻牌音效（短促上揚聲）
        function playFlipSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } catch (e) {}
        }

        // 配對成功音效（雙音）
        function playMatchSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                [660, 880].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.15, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.15);
                });
            } catch (e) {}
        }

        // ========== 視圖切換 ==========
        const lobbyView = document.getElementById('lobbyView');
        const paintView = document.getElementById('paintView');
        const memoryView = document.getElementById('memoryView');
        const welcomeOverlay = document.getElementById('welcome-overlay');

        function showLobby() {
            lobbyView.classList.remove('hidden');
            paintView.classList.add('hidden');
            memoryView.classList.add('hidden');
            document.getElementById('lobby-username').innerText = currentPlayerName;
        }

        function launchGame(gameId) {
            // 先隱藏所有視圖
            lobbyView.classList.add('hidden');
            paintView.classList.add('hidden');
            memoryView.classList.add('hidden');

            if (gameId === 'paint') {
                paintView.classList.remove('hidden');
                document.getElementById('user-display').innerText = `畫家：${currentPlayerName}`;
                setTimeout(resizeCanvas, 60);
                initAudio();
            } else if (gameId === 'memory') {
                memoryView.classList.remove('hidden');
                document.getElementById('memory-user-display').innerText = `${currentPlayerName} 的記憶翻牌`;
                initAudio();
                startMemoryGame();
            }
        }

        function goBackToLobby() {
            isDrawing = false; // 停止畫畫
            // 停止翻牌計時器（如果有的話）
            if (memoryFlipTimer) clearTimeout(memoryFlipTimer);
            showLobby();
        }

        // ========== 暱稱輸入 & 進入大廳 ==========
        const startBtn = document.getElementById('start-btn');

        function handleStart(e) {
            e.preventDefault();
            initAudio();
            const nameInput = document.getElementById('player-name');
            const name = nameInput ? nameInput.value.trim() : '小寶貝';
            currentPlayerName = name || '小寶貝';

            welcomeOverlay.classList.add('hidden');
            showLobby();
            document.getElementById('user-display').innerText = `畫家：${currentPlayerName}`;
            document.getElementById('lobby-username').innerText = currentPlayerName;
            document.getElementById('memory-user-display').innerText = `${currentPlayerName} 的記憶翻牌`;
        }

        startBtn.addEventListener('click', handleStart);
        startBtn.addEventListener('touchend', handleStart);

        // ========== 畫板相關邏輯 ==========
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#ff5252';

        function resizeCanvas() {
            const container = document.getElementById('canvas-area');
            if (!container || container.clientWidth === 0) return;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 12;
            ctx.strokeStyle = currentColor;
        }

        function setColor(color, e) {
            currentColor = color;
            ctx.strokeStyle = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            if (e && e.target) e.target.classList.add('active');
        }

        function clearCanvas() {
            if (confirm('確定要清空畫布重新開始嗎？')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function finishArt() {
            playPopSound();
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            alert('🎉 太棒了！這是一幅超棒的魔法藝術品！');
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            playPopSound();
        });

        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            playPopSound();
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => { isDrawing = false; });

        window.addEventListener('resize', () => {
            if (!paintView.classList.contains('hidden')) {
                resizeCanvas();
            }
        });

        // ========== 記憶翻牌遊戲邏輯 ==========
        const EMOJIS = ['🐶', '🐱', '🐼', '🦊', '🐸', '🐵', '🦄', '🐷']; // 8 對
        const TOTAL_PAIRS = EMOJIS.length;

        let memoryDeck = [];          // 牌組 [{emoji, id}]
        let memoryFlipped = [];        // 目前翻開的卡片 id（最多 2 張）
        let memoryMatched = 0;         // 已配對組數
        let memoryLock = false;        // 防止連點
        let memoryFlipTimer = null;    // 翻回計時器

        const memoryGridEl = document.getElementById('memoryGrid');
        const memoryStatusEl = document.getElementById('memoryStatus');
        const memoryWinEl = document.getElementById('memoryWin');

        // 洗牌
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // 初始化牌組
        function createDeck() {
            let deck = [];
            EMOJIS.forEach((emoji, index) => {
                deck.push({ emoji, pairId: index, id: deck.length });
                deck.push({ emoji, pairId: index, id: deck.length });
            });
            return shuffle(deck);
        }

        // 渲染卡片
        function renderMemoryGrid() {
            memoryGridEl.innerHTML = '';
            memoryDeck.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.cardId = card.id;
                cardEl.dataset.pairId = card.pairId;

                const inner = document.createElement('div');
                inner.className = 'card-inner';

                const front = document.createElement('div');
                front.className = 'card-front';
                front.textContent = '❓';

                const back = document.createElement('div');
                back.className = 'card-back';
                back.textContent = card.emoji;

                inner.appendChild(front);
                inner.appendChild(back);
                cardEl.appendChild(inner);

                cardEl.addEventListener('click', () => handleCardClick(cardEl));
                memoryGridEl.appendChild(cardEl);
            });
        }

        // 處理卡片點擊
        function handleCardClick(cardEl) {
            if (memoryLock) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
            if (memoryFlipped.length >= 2) return;

            // 翻牌
            cardEl.classList.add('flipped');
            playFlipSound();
            memoryFlipped.push(cardEl);

            // 檢查是否翻開兩張
            if (memoryFlipped.length === 2) {
                checkMatch();
            }
        }

        // 檢查配對
        function checkMatch() {
            const [card1, card2] = memoryFlipped;
            const pair1 = card1.dataset.pairId;
            const pair2 = card2.dataset.pairId;

            if (pair1 === pair2) {
                // 配對成功
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    memoryMatched++;
                    updateMemoryStatus();
                    playMatchSound();
                    memoryFlipped = [];
                    memoryLock = false;

                    // 檢查勝利
                    if (memoryMatched === TOTAL_PAIRS) {
                        winMemoryGame();
                    }
                }, 350);
                memoryLock = true;
            } else {
                // 配對失敗，延遲翻回
                memoryLock = true;
                memoryFlipTimer = setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    memoryFlipped = [];
                    memoryLock = false;
                    memoryFlipTimer = null;
                }, 900);
            }
        }

        // 更新狀態文字
        function updateMemoryStatus() {
            memoryStatusEl.innerText = `找到 ${memoryMatched} / ${TOTAL_PAIRS} 組配對`;
        }

        // 勝利
        function winMemoryGame() {
            memoryWinEl.classList.add('show');
            playMatchSound();
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 100, spread: 120, origin: { y: 0.4 } });
            }, 300);
        }

        // 開始 / 重置記憶遊戲
        function startMemoryGame() {
            // 清除計時器
            if (memoryFlipTimer) {
                clearTimeout(memoryFlipTimer);
                memoryFlipTimer = null;
            }
            // 重置狀態
            memoryDeck = createDeck();
            memoryFlipped = [];
            memoryMatched = 0;
            memoryLock = false;
            memoryWinEl.classList.remove('show');
            updateMemoryStatus();
            renderMemoryGrid();
        }

        // 重置按鈕
        function resetMemoryGame() {
            playFlipSound();
            startMemoryGame();
        }

        // 視窗大小改變時，畫布重繪（僅在畫板開啟時）
        // 初始化音效按鈕狀態
        updateSoundButtons();

        // 頁面載入完成後，如果已跳過遮罩（例如直接進入），確保大廳顯示正常
        // 但預設遮罩會顯示，所以不用特別處理
    </script>
</body>
</html>
