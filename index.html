<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>遊戲大廳 - 兒童創意樂園</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 950px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 6px solid #fff;
        }
        .header {
            background: #ff7043;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sound-btn {
            background: #ffca28;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 2px 0 #ffa000;
        }

        .lobby {
            flex: 1;
            padding: 20px 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            background: #f9fbe7;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #ffd54f, #ffb300);
            border-radius: 20px;
            padding: 18px 20px;
            text-align: center;
            color: #5d4037;
            box-shadow: 0 6px 0 #ff8f00;
            border: 3px solid #fff;
        }
        .welcome-banner h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }
        .welcome-banner p {
            margin: 0;
            font-size: 14px;
            color: #6d4c41;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .game-card {
            background: #fff;
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.08);
            border: 3px solid #ffe082;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .game-card:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
        }
        .game-icon {
            font-size: 44px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff3e0;
            border-radius: 18px;
            flex-shrink: 0;
            border: 2px dashed #ffb74d;
        }
        .game-info {
            flex: 1;
            text-align: left;
        }
        .game-info h3 {
            margin: 0 0 4px;
            font-size: 19px;
            color: #333;
        }
        .game-info p {
            margin: 0;
            font-size: 13px;
            color: #888;
            line-height: 1.4;
        }
        .play-badge {
            background: #4caf50;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 3px 0 #388e3c;
            flex-shrink: 0;
        }

        .hidden { display: none !important; }

        /* 畫板介面 */
        .paint-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .paint-header {
            background: #ff7043;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .paint-header .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn {
            background: #ffca28;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 2px 0 #ffa000;
        }
        .canvas-area {
            flex: 1;
            background: #111122;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
        }
        .canvas-area canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .toolbar {
            background: #fff8e1;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 3px solid #ffe082;
        }
        .palette {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .color-btn.active {
            transform: scale(1.25);
            border-color: #333;
        }
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .action-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #388e3c;
            flex: 1;
        }
        .action-btn.clear {
            background: #e57373;
            box-shadow: 0 4px 0 #c62828;
        }
        .action-btn.save {
            background: #4285F4;
            box-shadow: 0 4px 0 #1967d2;
        }

        /* 翻牌介面 */
        .memory-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .memory-header {
            background: #7b1fa2;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .memory-header .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .memory-header .back-btn {
            background: #ce93d8;
            box-shadow: 0 2px 0 #8e24aa;
        }
        .memory-content {
            flex: 1;
            padding: 16px;
            background: linear-gradient(180deg, #f3e5f5, #e1bee7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            overflow-y: auto;
        }
        .memory-status {
            background: #fff;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #6a1b9a;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            text-align: center;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 360px;
        }
        .card {
            aspect-ratio: 1 / 1;
            perspective: 600px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 14px;
        }
        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }
        .card-front {
            background: linear-gradient(135deg, #ba68c8, #7b1fa2);
            color: #fff;
            font-size: 40px;
        }
        .card-back {
            background: #fff;
            transform: rotateY(180deg);
            border: 3px solid #ce93d8;
        }
        .card.matched .card-back {
            background: #c8e6c9;
            border-color: #81c784;
        }
        .memory-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }
        .memory-actions .action-btn {
            flex: 1;
            font-size: 15px;
            padding: 10px 0;
        }
        .memory-actions .action-btn.reset {
            background: #7b1fa2;
            box-shadow: 0 4px 0 #4a148c;
        }
        .memory-win {
            font-size: 18px;
            font-weight: bold;
            color: #6a1b9a;
            text-align: center;
            padding: 10px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            display: none;
        }
        .memory-win.show {
            display: block;
        }

        /* ---------- 猜數字介面 ---------- */
        .guess-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .guess-header {
            background: #00897b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .guess-header .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .guess-header .back-btn {
            background: #80cbc4;
            box-shadow: 0 2px 0 #00695c;
        }
        .guess-content {
            flex: 1;
            padding: 20px;
            background: linear-gradient(180deg, #e0f2f1, #b2dfdb);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            overflow-y: auto;
        }
        .guess-tip {
            background: #fff;
            border-radius: 18px;
            padding: 14px 20px;
            font-size: 15px;
            color: #00695c;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
            line-height: 1.5;
            width: 100%;
            max-width: 380px;
        }
        .guess-tip strong {
            color: #d84315;
        }
        .guess-input-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 380px;
            align-items: center;
        }
        .guess-input-row input {
            flex: 1;
            padding: 14px;
            font-size: 24px;
            text-align: center;
            border: 3px solid #4db6ac;
            border-radius: 16px;
            outline: none;
            font-weight: bold;
            color: #00695c;
            min-width: 0;
        }
        .guess-input-row input:focus {
            border-color: #00897b;
        }
        .guess-submit {
            background: #00897b;
            color: #fff;
            border: none;
            padding: 14px 22px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #004d40;
            flex-shrink: 0;
        }
        .guess-submit:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #004d40;
        }
        .guess-history {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }
        .guess-item {
            background: #fff;
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 0 rgba(0,0,0,0.06);
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .guess-item .num {
            font-weight: bold;
            font-size: 18px;
            color: #00695c;
        }
        .guess-item .hint {
            font-weight: bold;
        }
        .guess-item .hint.too-high { color: #e53935; }
        .guess-item .hint.too-low { color: #1e88e5; }
        .guess-item .hint.correct { color: #43a047; }
        .guess-result {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.08);
            display: none;
        }
        .guess-result.show {
            display: block;
        }
        .guess-result .big-emoji {
            font-size: 56px;
            margin-bottom: 6px;
        }
        .guess-result h3 {
            margin: 0 0 8px;
            color: #00695c;
            font-size: 22px;
        }
        .guess-result p {
            margin: 0 0 14px;
            color: #666;
            font-size: 15px;
        }
        .guess-result button {
            background: #00897b;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #004d40;
        }
        .guess-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }
        .guess-actions .action-btn {
            flex: 1;
            font-size: 15px;
            padding: 12px 0;
        }
        .guess-actions .action-btn.reset {
            background: #00897b;
            box-shadow: 0 4px 0 #004d40;
        }

        /* 遮罩 */
        .welcome-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .welcome-card {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .welcome-card h2 {
            margin-top: 0;
        }
        .welcome-card input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin: 15px 0;
            border: 2px solid #ccc;
            border-radius: 12px;
            text-align: center;
        }
        .start-btn {
            background: #ff7043;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #d84315;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- 大廳視圖 -->
        <div id="lobbyView" class="lobby-view" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="header">
                <div class="header-title">
                    <span>🎮</span> <span>遊戲大廳</span>
                </div>
                <button class="sound-btn" id="sound-toggle-btn-lobby" onclick="toggleSound()">🔊 音效: 開</button>
            </div>
            <div class="lobby">
                <div class="welcome-banner">
                    <h2>👋 歡迎，<span id="lobby-username">小寶貝</span>！</h2>
                    <p>請選擇想玩的遊戲，更多遊戲陸續新增中 ✨</p>
                </div>
                <div class="game-grid" id="gameGrid">
                    <!-- 魔法畫板 -->
                    <div class="game-card" onclick="launchGame('paint')">
                        <div class="game-icon">🎨</div>
                        <div class="game-info">
                            <h3>神奇魔法畫板</h3>
                            <p>用手指或滑鼠自由塗鴉，繽紛色彩好好玩！</p>
                        </div>
                        <div class="play-badge">開始玩</div>
                    </div>
                    <!-- 記憶翻牌 -->
                    <div class="game-card" onclick="launchGame('memory')">
                        <div class="game-icon">🃏</div>
                        <div class="game-info">
                            <h3>記憶翻牌</h3>
                            <p>翻開卡片找出配對，訓練你的好記憶！</p>
                        </div>
                        <div class="play-badge">開始玩</div>
                    </div>
                    <!-- 猜數字 -->
                    <div class="game-card" onclick="launchGame('guess')">
                        <div class="game-icon">🔢</div>
                        <div class="game-info">
                            <h3>猜數字</h3>
                            <p>猜猜看我想的數字是多少？挑戰你的直覺！</p>
                        </div>
                        <div class="play-badge">開始玩</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 畫板遊戲視圖 -->
        <div id="paintView" class="paint-app hidden">
            <div class="paint-header">
                <div class="header-title">
                    <span>🎨</span> <span id="user-display">神奇魔法畫板</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="back-btn" onclick="goBackToLobby()">⬅ 大廳</button>
                    <button class="sound-btn" id="sound-toggle-btn-paint" onclick="toggleSound()">🔊 音效: 開</button>
                </div>
            </div>
            <div class="canvas-area" id="canvas-area">
                <canvas id="paintCanvas"></canvas>
            </div>
            <div class="toolbar">
                <div class="palette">
                    <div class="color-btn active" style="background: #ff5252;" onclick="setColor('#ff5252', event)"></div>
                    <div class="color-btn" style="background: #ffeb3b;" onclick="setColor('#ffeb3b', event)"></div>
                    <div class="color-btn" style="background: #69f0ae;" onclick="setColor('#69f0ae', event)"></div>
                    <div class="color-btn" style="background: #40c4ff;" onclick="setColor('#40c4ff', event)"></div>
                    <div class="color-btn" style="background: #e040fb;" onclick="setColor('#e040fb', event)"></div>
                    <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', event)"></div>
                </div>
                <div class="tools-row">
                    <button class="action-btn clear" onclick="clearCanvas()">🗑️ 全部清除</button>
                    <button class="action-btn save" onclick="finishArt()">✨ 完成作品！</button>
                </div>
            </div>
        </div>

        <!-- 記憶翻牌遊戲視圖 -->
        <div id="memoryView" class="memory-app hidden">
            <div class="memory-header">
                <div class="header-title">
                    <span>🃏</span> <span id="memory-user-display">記憶翻牌</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="back-btn" onclick="goBackToLobby()">⬅ 大廳</button>
                    <button class="sound-btn" id="sound-toggle-btn-memory" onclick="toggleSound()">🔊 音效: 開</button>
                </div>
            </div>
            <div class="memory-content">
                <div class="memory-status" id="memoryStatus">找到 0 / 8 組配對</div>
                <div class="memory-grid" id="memoryGrid"></div>
                <div class="memory-win" id="memoryWin">🎉 全部配對成功！你太厲害了！</div>
                <div class="memory-actions">
                    <button class="action-btn reset" onclick="resetMemoryGame()">🔄 重新開始</button>
                </div>
            </div>
        </div>

        <!-- 猜數字遊戲視圖 -->
        <div id="guessView" class="guess-app hidden">
            <div class="guess-header">
                <div class="header-title">
                    <span>🔢</span> <span id="guess-user-display">猜數字</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="back-btn" onclick="goBackToLobby()">⬅ 大廳</button>
                    <button class="sound-btn" id="sound-toggle-btn-guess" onclick="toggleSound()">🔊 音效: 開</button>
                </div>
            </div>
            <div class="guess-content">
                <div class="guess-tip" id="guessTip">
                    我想了一個 <strong>1 ~ 100</strong> 的數字，<br>快來猜猜看是什麼！
                </div>
                <div class="guess-input-row" id="guessInputRow">
                    <input type="number" id="guessInput" placeholder="?" min="1" max="100" inputmode="numeric">
                    <button class="guess-submit" onclick="submitGuess()">猜！</button>
                </div>
                <div class="guess-history" id="guessHistory"></div>
                <div class="guess-result" id="guessResult">
                    <div class="big-emoji">🎉</div>
                    <h3 id="guessResultTitle">猜對了！</h3>
                    <p id="guessResultText"></p>
                    <button onclick="resetGuessGame()">再玩一次</button>
                </div>
                <div class="guess-actions">
                    <button class="action-btn reset" onclick="resetGuessGame()">🔄 重新開始</button>
                </div>
            </div>
        </div>

        <!-- 進入遮罩 -->
        <div id="welcome-overlay" class="welcome-overlay">
            <div class="welcome-card">
                <h2>✨ 遊戲樂園 ✨</h2>
                <p style="color: #666; font-size: 15px;">請輸入你的小名：</p>
                <input type="text" id="player-name" placeholder="請輸入名字..." value="小寶貝">
                <button class="start-btn" id="start-btn">進入遊戲大廳</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 全域狀態 ==========
        let currentPlayerName = '小寶貝';
        let soundEnabled = true;
        let audioCtx = null;

        // ========== 音效控制 ==========
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {

                const btn = document.getElementById(id);
                if (btn) btn.innerText = label;
            });

        function playPopSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(300 + Math.random() * 400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } catch (e) {}
        }

            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const now = audioCtx.currentTime;

                osc.frequency.linearRampToValueAtTime(800, now + 0.08);

            paintView.classList.add('hidden');
            memoryView.classList.add('hidden');
            guessView.classList.add('hidden');
            document.getElementById('lobby-username').innerText = currentPlayerName;
        }

            lobbyView.classList.add('hidden');
            paintView.classList.add('hidden');
            memoryView.classList.add('hidden');
            guessView.classList.add('hidden');

            if (gameId === 'paint') {
                paintView.classList.remove('hidden');
                document.getElementById('user-display').innerText = `畫家：${currentPlayerName}`;

                startMemoryGame();

                resetGuessGame();
            }
