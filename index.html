<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神奇魔法畫板 - 兒童創意塗鴉</title>
    <!-- 引入彩帶特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 950px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 6px solid #fff;
        }
        /* 頂部標題與工具列 */
        .header {
            background: #ff7043;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sound-btn {
            background: #ffca28;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 2px 0 #ffa000;
        }
        /* 畫布區域 */
        .canvas-area {
            flex: 1;
            background: #111122;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* 底部色彩與工具列 */
        .toolbar {
            background: #fff8e1;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 3px solid #ffe082;
        }
        .palette {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .color-btn.active {
            transform: scale(1.25);
            border-color: #333;
        }
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .action-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #388e3c;
            flex: 1;
        }
        .action-btn.clear {
            background: #e57373;
            box-shadow: 0 4px 0 #c62828;
        }
        .action-btn.save {
            background: #4285F4;
            box-shadow: 0 4px 0 #1967d2;
        }
        /* 歡迎遮罩 */
        .welcome-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .welcome-card {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .welcome-card input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin: 15px 0;
            border: 2px solid #ccc;
            border-radius: 12px;
            text-align: center;
        }
        .start-btn {
            background: #ff7043;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #d84315;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頂部列 -->
        <div class="header">
            <div class="header-title">
                <span>🎨</span> <span id="user-display">神奇魔法畫板</span>
            </div>
            <button class="sound-btn" id="sound-toggle-btn" onclick="toggleSound()">🔊 音效: 開</button>
        </div>

        <!-- 畫布區域 -->
        <div class="canvas-area" id="canvas-area">
            <canvas id="paintCanvas"></canvas>
        </div>

        <!-- 底部色彩與工具列 -->
        <div class="toolbar">
            <div class="palette">
                <div class="color-btn active" style="background: #ff5252;" onclick="setColor('#ff5252')"></div>
                <div class="color-btn" style="background: #ffeb3b;" onclick="setColor('#ffeb3b')"></div>
                <div class="color-btn" style="background: #69f0ae;" onclick="setColor('#69f0ae')"></div>
                <div class="color-btn" style="background: #40c4ff;" onclick="setColor('#40c4ff')"></div>
                <div class="color-btn" style="background: #e040fb;" onclick="setColor('#e040fb')"></div>
                <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
            </div>
            <div class="tools-row">
                <button class="action-btn clear" onclick="clearCanvas()">🗑️ 全部清除</button>
                <button class="action-btn save" onclick="finishArt()">✨ 完成作品！</button>
            </div>
        </div>

        <!-- 進入畫面遮罩 -->
        <div id="welcome-overlay" class="welcome-overlay">
            <div class="welcome-card">
                <h2>✨ 神奇魔法畫板 ✨</h2>
                <p style="color: #666; font-size: 15px;">請輸入小畫家的名字：</p>
                <input type="text" id="painter-name" placeholder="請輸入名字..." value="小寶貝">
                <button class="start-btn" id="start-btn">開始畫畫！</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#ff5252';
        let soundEnabled = true;
        let audioCtx = null;

        function resizeCanvas() {
            const container = document.getElementById('canvas-area');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 12;
            ctx.strokeStyle = currentColor;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle-btn').innerText = soundEnabled ? "🔊 音效: 開" : "🔇 音效: 關";
            if (soundEnabled) initAudio();
        }

        function playPopSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(300 + Math.random() * 400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } catch (e) {}
        }

        // 綁定「開始畫畫」按鈕事件（同時支援點擊與手機觸控）
        const startBtn = document.getElementById('start-btn');
        function handleStart(e) {
            e.preventDefault();
            initAudio();
            const nameInput = document.getElementById('painter-name');
            const name = nameInput ? nameInput.value.trim() : "小寶貝";
            
            document.getElementById('user-display').innerText = `畫家：${name || '小寶貝'}`;
            document.getElementById('welcome-overlay').classList.add('hidden');
            
            // 延遲一下確保畫布尺寸抓取正確
            setTimeout(resizeCanvas, 50);
        }

        startBtn.addEventListener('click', handleStart);
        startBtn.addEventListener('touchend', handleStart);

        function setColor(color) {
            currentColor = color;
            ctx.strokeStyle = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function clearCanvas() {
            if (confirm('確定要清空畫布重新開始嗎？')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function finishArt() {
            playPopSound();
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
            alert('🎉 太棒了！這是一幅超棒的魔法藝術品！');
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            playPopSound();
        });

        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            playPopSound();
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => { isDrawing = false; });
    </script>
</body>
</html>
